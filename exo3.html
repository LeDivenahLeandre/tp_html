<!DOCTYPE html>
<html lang="en">

<body>
    <h1>Crêpes</h1>

    <em>Recette de crêpes</em>

    <h2>Ingredients</h2>
    <ul>
        <li>250 g de farine</li>
        <li>4 oeufs</li>
        <li>1/2 litre de lait</li>
        <li>1 pincée de sel</li>
        <li>50 g de beurre</li>      
    </ul>    
    
    <h2>Etapes de préparations</h2>
    <ul>
        <ol>Melangez <strong>farine</strong> et <strong>sel</strong></ol>
        <ol>Ajoutez les <strong>oeufs</strong></ol>
        <ol>Ajoutez le <strong>beurre</strong></ol>
        <ol>Déguster</ol>
    </ul>

</body>
</html>
